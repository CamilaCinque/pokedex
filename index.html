<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/MaterialDesign-Webfont/7.4.47/css/materialdesignicons.min.css">
    
    <link rel="icon" href="./images/favicon-16x16.png">
    <link rel="stylesheet" href="./css/style.css">
    
    <title>pokedex</title>
</head> 

<body>
    <main>

        <img src="" alt="pokemon" class="pokemon_image">

        <h1 class="pokemon_data">
            <span class="pokemon_number">6</span>-
            <span class="pokemon_name">charizard</span>
        </h1>

        <form class="form">
            <input type="search"
            class="input_search"
            placeholder="name or number"
            required
            />
        </form>

        <div class="buttons">
            <button class="button btn-prev"><span class="mdi mdi-chevron-left"></span>Prev</button>
            <button class="button btn-next"> Next <span class="mdi mdi-chevron-right"></span></button>
        </div>

        <img src="./images/pokedex.png" alt="" class="pokedex">

    </main>
</body>
</html>
